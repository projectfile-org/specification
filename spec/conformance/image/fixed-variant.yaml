description: >-
  A part naming no matrix axis takes its default, so the one cell publishes the
  suffixed tags beside the bare heads.

input:
  image:
    series: "{B19_UBUNTU_SERIES}"
    heads:
      release: ["${version}", "${major}.${minor}", "${major}", latest]
      prerelease: ["${version}"]
      trunk: [edge]
      branch: ["latest-${branch}"]
    variant: {parts: [series], join: "-", aliases: defaults, tag: "${head}-${variant}", bare: [latest]}
  build: {args: {B19_UBUNTU_SERIES: resolute}}
publish: {version: 0.20.0}

expect:
  cells:
    - cell: {series: resolute}
      tags: [0.20.0-resolute, 0.20-resolute, 0-resolute, resolute, 0.20.0, "0.20", "0", latest]
