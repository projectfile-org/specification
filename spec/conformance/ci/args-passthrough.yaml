description: >-
  The {args: "…"} override branch both ENABLES a tool and binds an arg string
  that the consumer must deliver to the tool's invocation.

input:
  nodes:
    code-is-valid:
      goal: true
      needs:
        eslint:
          args: --max-warnings 0
        html-validate:
          args: "dist/"

expect:
  runs: [eslint, html-validate]
  args:
    eslint: --max-warnings 0
    html-validate: dist/
