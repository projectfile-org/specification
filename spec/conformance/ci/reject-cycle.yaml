description: >-
  `needs` edges that form a loop have no topological order. The subtree is
  STRUCTURALLY valid (JSON Schema cannot see the cycle); a resolver MUST refuse.

input:
  nodes:
    a:
      needs:
        b: true              # node dep — creates the cycle
        tool-a: true
    b:
      needs:
        a: true              # node dep — creates the cycle
        tool-b: true

expect:
  reject: cycle
