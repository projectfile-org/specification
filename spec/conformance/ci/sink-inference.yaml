description: >-
  With no node flagged `goal: true`, every graph sink is a goal — so the same
  `formatted` node that was excluded under an explicit goal now runs. Contrast
  with closure-goal-exclusion.yaml.

input:
  # no goal flags -> sinks are {published, formatted}
  nodes:
    code-is-valid:
      needs: {shellcheck: true}
    formatted:
      needs: {eslint-fix: true}
    published:
      needs: [code-is-valid]

expect:
  runs: [shellcheck, eslint-fix]
