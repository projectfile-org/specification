# Shape: org.projectfile.editors extension namespace
# Illustrative fragment — not a complete projectfile document.
# See registry.yaml for ownership and status.

org:
  projectfile:
    editors:
      # Editors/IDEs used in this project. When set, the ignore bridge emits
      # per-editor gitignore snippets (editor:idea, editor:vscode, etc.).
      # When absent, pf-cli auto-detects editors by probing the project
      # directory for known markers (.idea/, .vscode/, .vimrc, etc.).
      #
      # Recognised values: idea | vscode | vim | emacs | sublimetext
      use: [idea, vscode]
