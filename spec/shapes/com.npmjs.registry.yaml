com:
  npmjs:
    registry:
      registry: "https://registry.npmjs.org"  # OPTIONAL  primary registry URL
      scope: "@myorg"  # OPTIONAL  package scope
      access: public  # OPTIONAL  public | restricted
      tag: latest  # OPTIONAL  dist-tag on publish
      provenance: true  # OPTIONAL  npm provenance attestation

      # Per-scope registry routing. Key is the scope name without the leading "@".
      scopes:
        myorg: "https://npm.pkg.github.com"  # @myorg → this registry
