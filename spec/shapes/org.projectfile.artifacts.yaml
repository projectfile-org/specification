# Shape: org.projectfile.artifacts extension namespace
# Illustrative fragment — not a complete projectfile document.
# See registry.yaml for ownership and status.
#
# A map of NAMED artifacts a project PRODUCES — the images it publishes, the
# packages it ships, the executables it installs, the services it exposes. One
# neutral home for "what does this project give me", read by a CI tool that needs
# pointing at an output AND by a documentation generator that needs to say how to
# install the thing and how to call it.
#
# Each entry declares a `kind` plus the address fields that kind is addressed by:
#
#   image    ref              a pull reference
#   binary   command, path    the name a user types; the built file
#   package  registry, name   which index, and the name published there
#   module   module           an importable path
#   service  ports            what it listens on
#   website  url              a reachable address
#   ssh      url              a reachable address, ssh:// scheme
#   archive  path             a bundle on disk
#
# `website` and `ssh` are the same PROTOCOL shape — one address, one scheme, one
# live auditor selecting on `{kind=…}` — and every further protocol kind follows
# it (`mysql` addressed by `mysql://host:3306`) instead of inventing a new one.
#
# A protocol artifact is usually reachable at SEVERAL addresses at once — a
# developer's local vhost, an ephemeral CI stack, the public origin — so it also
# carries an `environment` naming which deployment its `url` is true in. That is
# a second selector dimension, not a second kind: `{kind=website,environment=ci}`
# picks the CI address and nothing else. An artifact with no `environment` is
# environment-neutral and matches no environment selector at all, so an auditor
# built for an ephemeral stack can never silently fall through to production.
#
# Referenced from any string via the §3.8 interpolation sigil, two ways:
#
#   By NAME — one artifact, when a tool wants a specific output:
#     run: gsa ${org.projectfile.artifacts.cli.path}
#
#   By KIND — every artifact of a kind, using the MAP selector (curly braces,
#   because artifacts is a mapping of named keys, not a list):
#     commands: ["docker pull ${org.projectfile.artifacts{kind=image}.ref}"]
#
#   By SEVERAL fields — the selector takes a comma-separated predicate list and
#   an entry must match every one, which is how two artifacts of the same kind
#   are told apart (`registry` for packages, `environment` for addresses):
#     ${org.projectfile.artifacts{kind=website,environment=ci}.url}
#
# The map selector yields EVERY match, not the first, because a mapping has no
# order in which "first" would mean anything (§3.8). A consumer whose output
# repeats — one line of a code block — emits one copy per value. That is what
# lets a project publishing one image per matrix cell be documented completely by
# a fragment that names no cell.
#
# The kind selector is ALSO what makes a shared fragment self-guarding: a recipe
# addressing an artifact the consuming project does not declare resolves to
# nothing, and a consumer that must not publish a half-substituted string drops
# that output instead. One fragment can therefore carry an install command for
# every ecosystem in a fleet, and each project renders only its own.

org:
  projectfile:
    artifacts:
      # what a user types, and what a size analyzer measures in place
      cli:
        # kind is an OPEN vocabulary: a consumer MUST NOT reject an unknown kind,
        # and MUST NOT change any lowering (a workflow, a build) based on it — for
        # that purpose it is advisory, like a tool's `tags`. It IS load-bearing
        # for documentation and for the `{kind=…}` selector, neither of which is
        # a lowering.
        kind: binary
        command: pf-cli
        path: dist/pf-cli

      # the published image; `${image.basename}` is the derived namespace/name
      # path every lowering of this fleet already agrees on
      image:
        kind: image
        ref: kiota.ch/${image.basename}:latest

      # a package, distinguished from a sibling package by its registry
      npm-package:
        kind: package
        registry: npm
        name: "@projectfile/reader"

      # a service is addressed by what it LISTENS on — the one thing no generic
      # description of a service could supply
      database:
        kind: service
        summary: MySQL-compatible database
        ports:
          - 3306
          - port: 9104
            name: metrics

      # what lighthouse / linkinator audit — one entry per deployment, because
      # the address a page auditor dials depends on where the run is happening
      frontpage:
        kind: website
        environment: production
        url: https://projectfile.org

      frontpage-ci:
        kind: website
        environment: ci
        url: https://pf-nginx.ci.localhost

      # what ssh-audit audits — the scheme carries the port, so one field is the
      # whole address; in CI the host is the compose SERVICE name the tool joins
      sshd-ci:
        kind: ssh
        environment: ci
        url: ssh://projectfile-sshd:22
