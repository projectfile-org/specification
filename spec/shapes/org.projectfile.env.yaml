# Shape: org.projectfile.env extension namespace
# Illustrative fragment — not a complete projectfile document.
# See registry.yaml for ownership and status.

org:
  projectfile:
    env:
      required:
        - name: DATABASE_URL  # REQUIRED  variable name
          description: PostgreSQL connection DSN  # OPTIONAL
          example: "postgres://user:pass@localhost:5432/mydb"  # OPTIONAL  non-sensitive example
          secret: false  # OPTIONAL  omit from .env.example
        - name: API_KEY
          secret: true  # value is sensitive — omit from .env.example

      optional:
        - name: LOG_LEVEL  # REQUIRED  variable name
          default: info  # OPTIONAL  value when unset
          values: [debug, info, warn, error]  # OPTIONAL  closed enum of allowed values
