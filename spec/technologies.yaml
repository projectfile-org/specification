# Recommended vocabulary for the `technologies` reserved field.
# See spec/v1.md Section 4.7 — this vocabulary is non-normative.
#
# Shape: <tag>:
#          category: language | runtime | framework | data | platform | tooling
#          synonyms: [ ... ]    # other names that SHOULD be normalized to this tag
#          homepage: URL        # canonical / authoritative site for the technology
#          description: short human-readable summary
#          use-cases: [ ... ]   # OPTIONAL advisory tokens hinting what tooling can
#                               # do with this tag, e.g. `gitignore`, `dockerignore`,
#                               # `editorconfig`. Purely advisory; consumers MAY use
#                               # them to offer generation features (see spec v1.md §4.7).
#
# Tags are human-friendly bare names (e.g. `python`, not `python.org`). The
# homepage field captures the canonical URL for tooling that wants to render
# a link or disambiguate forks/implementations without bloating the tag itself.
#
# Contributing: open a PR adding a tag with a one-line rationale in the commit
# message. No gate-keeping. Synonyms are the mechanism for disambiguation —
# prefer extending synonyms on an existing tag over creating a sibling.

