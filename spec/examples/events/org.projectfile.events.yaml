# Positive fixture — the bare VALUE of an org.projectfile.events subtree.
# Validated against ../../schema/org.projectfile.events.v1.json (MUST pass).
# Phase 1: the webhook sink pointed at a forge variable by an explicit runtime-
# env binding ({ env: NAME }). An empty object ({}) also validates and opts the
# project in with the default EVENTS_WEBHOOK_URL variable.

webhook:
  url:
    env: EVENTS_WEBHOOK_URL
