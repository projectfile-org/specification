# INVALID subtree fixture — a secret declaration carrying BOTH `value` and
# `docker`. A secret is materialised by exactly ONE source: a literal written
# verbatim (`value`) OR a container run whose stdout is captured (`docker`).
# Allowing both would leave the dispatcher with an ambiguous precedence and let
# a typo silently write a static value where a generator was intended (or vice
# versa). The `secret` $def's object form (`maxProperties: 1`) MUST reject this
# — exactly one source per secret.

secrets:
  o9s.mariadb.password:
    value: changeme                   # <- a literal source
    docker: m6e-secret-random         # <- AND a generator source: ambiguous, rejected
