# INVALID subtree fixture — a `docker:` secret whose `image:` is a free-form
# registry ref rather than the one reserved value `self`. The secret-provisioning
# dispatcher resolves the image from ONE of two honest sources ONLY: `self`
# (run the project's OWN built image — the self-hosting keygen case) or ABSENT
# (the default misc-tools image where the m6e-secret-* recipes live). A literal
# ref like `ghcr.io/acme/tool:1` is neither — it smuggles a deployment-specific
# registry host into the vendor-NEUTRAL subtree (the same prohibition the tool
# manifest `image:` enforces by taking a VAR NAME, not a ref). The
# `secretDocker.image` description names `self` as the sole authored value; an
# explicit enum guard rejects anything else so a typo cannot pull an arbitrary
# image at provisioning time.

secrets:
  o9s.mariadb.password:
    docker:
      image: ghcr.io/acme/keygen:1    # <- a free-form ref, not `self` or absent: rejected
      run: generate-key
