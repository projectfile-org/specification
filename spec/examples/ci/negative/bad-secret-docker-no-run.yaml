# INVALID subtree fixture — a `docker:` secret in object form with no `run`.
# `run` is the entrypoint command whose stdout becomes the secret; it is the
# ONE required field of the object form (the bare-string shorthand supplies it
# directly). An object `{image: self}` with no `run` names a container but no
# command, which would `docker run <image>` with no entrypoint override and
# capture whatever default the image happens to ship — a silent, image-defined
# secret. The `secretDocker` $def's object form (`required: [run]`) MUST reject
# this so the omission fails at authoring, not at a confusing runtime capture.

secrets:
  f5m.tor.site-hs-key:
    docker:
      image: self                     # <- no `run` command: rejected (required field)
