# INVALID subtree fixture — a secret VALUE smuggled into a manifest `env:`. The
# `env:` list carries env-var NAMES ONLY (pattern ^[A-Za-z_][A-Za-z0-9_]*$); the
# secret VALUE belongs in the per-target `<target>.credentials` overlay, which is
# the ONE place a `${{ secrets.* }}` reference may appear. A secret expression as
# an env item (its `$`, `{`, spaces break the name pattern) MUST be rejected by
# spec/schema/org.projectfile.ci.v1.json — keeping secrets out of the committed
# projectfile by construction.

nodes:
  published:
    goal: true
    needs:
      gh-release: true
tools:
  gh-release:
    run: gh release create
    env:
      - ${{ secrets.GITHUB_TOKEN }}   # <- a secret VALUE, not a NAME: rejected
