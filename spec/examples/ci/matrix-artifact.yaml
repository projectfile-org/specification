# Positive subtree fixture — the VALUE at org.projectfile.ci. Each binary node fans over the
# cells of the `cli` artifact record (TARGET_OS × TARGET_ARCH minus its exclude list).

nodes:
  binaries-built:
    matrix: {artifact: cli}
    needs:
      build-binaries: true
  binaries-analyzed:
    matrix: {artifact: cli}
    needs:
      binaries-built: true
      gsa: true
