# INVALID — identity.visibility is written as a localized-string. The field is
# a closed two-value enum, never a localized value: a consumer cannot publish
# "public" in one language and "private" in another.

$schema: https://projectfile.org/schema/v1.json

identity:
  namespace: org.example
  name: non-scalar-visibility
  visibility:
    en: public
