# INVALID — two repository entries both carry role: origin. At most one
# entry may be origin; the spec requires exactly one when len > 1
# (§4.3a, repositories field). Enforced by the schema's contains + maxContains: 1.

$schema: https://projectfile.org/schema/v1.json

identity:
  namespace: org.example
  name: two-origin

repositories:
  - url: https://github.com/example/two-origin
    type: git
    role: origin
  - url: https://codeberg.org/example/two-origin
    type: git
    role: origin
