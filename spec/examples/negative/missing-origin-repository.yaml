# INVALID — two repository entries but neither carries role: origin.
# The spec requires exactly one entry to be origin when len > 1
# (§4.3a, repositories field). Enforced by if minItems: 2 then minContains: 1.

$schema: https://projectfile.org/schema/v1.json

identity:
  namespace: org.example
  name: no-origin

repositories:
  - url: https://github.com/example/no-origin
    type: git
    role: mirror
  - url: https://codeberg.org/example/no-origin
    type: git
    role: archive
