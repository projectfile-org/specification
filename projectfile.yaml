  summary:
    en: Stack- and vendor-agnostic software project specification file.
    es: Archivo de especificación de proyectos de software agnóstico de pila y de proveedor.
    uk: Файл специфікації програмного проєкту, незалежний від технологічного стека та постачальника.
  title: The Projectfile Specification
  description:
    en: 'The normative specification of the projectfile: a single stack- and vendor-agnostic YAML file that describes a software project identity, build, CI and publishing. Holds the spec prose and v1 JSON Schema, dual-licensed MIT and CC-BY-4.0, rendered at projectfile.org and consumed by the pf-cli, pf-bridge and pf-ci tools.'
    es: 'La especificación normativa del projectfile: un único archivo YAML agnóstico de pila y de proveedor que describe la identidad, compilación, CI y publicación de un proyecto de software. Contiene la prosa de la especificación y el esquema JSON v1, con doble licencia MIT y CC-BY-4.0, renderizada en projectfile.org y consumida por las herramientas pf-cli, pf-bridge y pf-ci.'
    uk: 'Нормативна специфікація projectfile: єдиний YAML-файл, незалежний від технологічного стека та постачальника, що описує ідентичність, збирання, CI та публікацію програмного проєкту. Містить текст специфікації та JSON-схему v1 з подвійною ліцензією MIT і CC-BY-4.0, відображається на projectfile.org і використовується інструментами pf-cli, pf-bridge та pf-ci.'
